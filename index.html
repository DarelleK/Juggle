<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>Juggle</title>
<style>
:root{--sky1:#1b2a44;--sky2:#2b3d5c;--hill:#24402c;--bg:#0f1115;--card:#181b22;--card2:#232832;--tx:#e8eaf0;--mu:#8b93a7;--ln:#2a2f3a;--ac:#4f8cff;--danger:#ff5d5d;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--sky1:#cfe8ff;--sky2:#eef7ff;--hill:#a6d68c;--bg:#f4f5f8;--card:#fff;--card2:#eceff4;--tx:#151821;--mu:#626b7f;--ln:#dfe3ea;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--bg);border-bottom:1px solid var(--ln)}
header h1{font-size:19px;margin:0;flex:1;letter-spacing:-.01em}
main{padding:12px 16px 120px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:8px 0 10px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:20px;line-height:1.2}
nav button.on{color:var(--ac);font-weight:600}
#fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 6px 20px #0006;z-index:6}
.ib{background:var(--card2);border:0;border-radius:10px;padding:7px 11px}
.pill{background:var(--ac);color:#fff;border:0;border-radius:20px;padding:5px 11px;font-size:13px;display:none;font-variant-numeric:tabular-nums}
h2{font-size:18px;margin:4px 0 12px}
h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:20px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h3 .ib{text-transform:none;letter-spacing:0;font-size:13px;color:var(--tx)}
.card{background:var(--card);border-radius:14px;padding:12px}
.row{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.row.done .rt{text-decoration:line-through;color:var(--mu)}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--c);background:none;color:#fff;font-size:13px;padding:0;margin-top:1px}
.row.done .chk{background:var(--c)}
.rb{flex:1;min-width:0;cursor:pointer}
.rt{overflow-wrap:anywhere}
.rm{font-size:12.5px;color:var(--mu);margin-top:2px}
.rm i,.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.p1{color:var(--danger);font-weight:700}
.od{color:var(--danger)}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.daynav .t{flex:1;text-align:center}.daynav b{display:block;font-size:20px}.daynav small{color:var(--mu)}
.bal{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--card2);margin:4px 0 6px}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mu)}
.tlwrap{max-height:62vh;overflow-y:auto;background:var(--card);border-radius:14px;padding:12px 8px 12px 0}
.grid{position:relative}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--ln)}
.hr span{position:absolute;left:6px;top:-8px;font-size:11px;color:var(--mu);background:var(--card);padding-right:4px}
.lane{position:absolute;left:52px;right:0;top:0;bottom:0}
.blk{position:absolute;border-radius:8px;padding:3px 7px;background:color-mix(in srgb,var(--c) 24%,var(--card));border-left:4px solid var(--c);overflow:hidden;font-size:12.5px;line-height:1.25;cursor:pointer}
.blk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk small{color:var(--mu)}
.blk.done{opacity:.45}.blk.done b{text-decoration:line-through}
.blk.routine{border-left-style:dashed}
.now{position:absolute;left:46px;right:0;border-top:2px solid var(--danger);z-index:2;pointer-events:none}
.now::before{content:'';position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--ln);background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.empty{color:var(--mu);text-align:center;padding:16px;font-size:14px}
.qa{display:flex;gap:6px;margin-top:10px}.qa input{margin:0;flex:1}.qa select{margin:0;width:auto;max-width:30%;font-size:13px;padding:10px 6px}.qa .ib{font-size:20px;padding:0 14px}
.qbox{margin-top:4px;padding:10px}
.qbox .qa{margin-top:0}.addb{font-size:22px;padding:0 16px}
.qrow{display:flex;align-items:center;gap:8px;margin-top:8px}.qrow>span{flex:none;width:58px;font-size:12px;color:var(--mu)}
.qrow .chips{margin:0;padding:0;flex:1;align-items:center;flex-wrap:wrap;overflow:visible}.qrow .chip{padding:6px 10px;font-size:12.5px}
.qdate{width:auto;margin:0;padding:5px 8px;font-size:13px;border-radius:20px;flex:none}.qdate.on{border-color:var(--ac);background:var(--ac);color:#fff}
.qrow select{width:auto;margin:0;padding:5px 8px;font-size:13px;border-radius:20px;flex:none}
.hint{color:var(--mu);font-size:12.5px;margin:6px 2px}
#sheet{position:fixed;inset:0;background:#0009;z-index:10;display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
.panel{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.panel label{display:block;font-size:12.5px;color:var(--mu);margin:8px 0}
input,select,textarea{display:block;width:100%;margin-top:4px;background:var(--card2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;font:inherit;font-size:16px}
input[type=color]{padding:2px;height:42px;width:48px;flex:none;margin:0}
[hidden]{display:none!important}
textarea{min-height:60px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;margin:8px 0}
.seg label{flex:1;margin:0}
.seg input{display:none}
.seg span{display:block;text-align:center;padding:9px 0;border-radius:10px;background:var(--card2);color:var(--tx);font-size:14px}
.seg input:checked+span{background:var(--ac);color:#fff}
.chkl{display:flex!important;align-items:center;gap:8px;color:var(--tx)!important;font-size:14px!important}
.chkl input{width:20px;height:20px;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btns button{border:0;border-radius:10px;padding:10px 14px;background:var(--card2)}
.btns .pri{background:var(--ac);color:#fff;flex:1 0 100%;font-weight:600}
.btns .danger{color:var(--danger)}
.arow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.arow input[type=text]{margin:0}
.arow button{flex:none}
.muted{color:var(--mu);font-size:13px}
.ctr{text-align:center}
.ctr .btns{justify-content:center}
.mode{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#dlg{position:fixed;inset:0;background:#0009;z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
#dlg.open{display:flex}
#dlg .box{background:var(--card);border-radius:16px;padding:18px;max-width:360px;width:100%}
#dlg p{margin:0 0 6px;font-size:16px}
</style>
</head>
<body>
<header>
  <h1>Juggle</h1>
  <button id="pill" class="pill" data-act="gofocus"></button>
  <button class="ib" id="lvl" data-act="gogrow" aria-label="Level and streak"></button>
  <button class="ib" data-act="settings" aria-label="Settings">⚙︎</button>
</header>
<main id="view"></main>
<button id="fab" data-act="add" aria-label="Add">+</button>
<nav>
  <button data-tab="today"><span>☀︎</span>Today</button>
  <button data-tab="tasks"><span>☑︎</span>Tasks</button>
  <button data-tab="goals"><span>🌱</span>Grow</button>
  <button data-tab="routines"><span>↻</span>Routines</button>
  <button data-tab="focus"><span>⏱</span>Focus</button>
</nav>
<div id="sheet"></div>
<div id="toast"></div>
<div id="dlg"><div class="box"><p id="dlgmsg"></p><div class="btns"><button id="dlgno">Cancel</button><button id="dlgyes" class="danger">OK</button></div></div></div>
<input type="file" id="imp" accept="application/json,.json" hidden>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fromMin = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const today = () => ymd(new Date());
const nowMin = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDur = m => m < 60 ? m + 'm' : (m % 60 ? Math.floor(m / 60) + 'h' + (m % 60) + 'm' : m / 60 + 'h');
const fmtShort = s => s === today() ? 'Today' : s === addDays(today(), 1) ? 'Tomorrow' : parseYmd(s).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const fmtTime = t => { const m = toMin(t), h = Math.floor(m / 60); return `${h % 12 || 12}:${pad(m % 60)}${h < 12 ? 'a' : 'p'}`; };
const DN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

/* ---------- state (stored only on this device) ---------- */
const KEY = 'juggle.v1';
const DEFAULT = {
  areas: [
    { id: 'a1', name: 'Work', color: '#4f8cff' },
    { id: 'a2', name: '1st Providence', color: '#2bb673' },
    { id: 'a3', name: 'VCU / Classes', color: '#f2994a' },
    { id: 'a4', name: 'Personal', color: '#b06ce0' }
  ],
  tasks: [], routines: [], goals: [], xp: { total: 0, byArea: {}, days: {} }, routineDone: {}, focusLog: [], timer: null,
  settings: { dayStart: 6, dayEnd: 23, pomo: 25, brk: 5, lead: 10, showTimeline: false, lastArea: null, morning: '07:30', evening: '20:30', nudged: {} }
};
let S = load();
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.areas) {
      const m = Object.assign(structuredClone(DEFAULT), s);
      m.settings = Object.assign({}, DEFAULT.settings, s.settings);
      m.xp = Object.assign({ total: 0, byArea: {}, days: {} }, s.xp);
      m.areas.forEach(a => { if (a.name === 'Vocational School') a.name = 'Work'; });
      const cut = addDays(today(), -60);
      for (const k in m.routineDone) if (k.split('|')[1] < cut) delete m.routineDone[k];
      m.focusLog = m.focusLog.filter(l => l.date >= cut);
      return m;
    }
  } catch (e) { }
  return structuredClone(DEFAULT);
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Could not save — storage full?'); }
}
const area = id => S.areas.find(a => a.id === id) || { name: 'No area', color: '#888' };

let view = 'today', day = today(), filterArea = 'all', tlScrolled = false, installEvt = null;

/* ---------- scheduling logic ---------- */
function routinesOn(date) {
  const wd = parseYmd(date).getDay();
  return S.routines.filter(r => r.active !== false && r.days.includes(wd));
}
function dayItems(date) {
  const items = [];
  S.tasks.filter(t => t.schedDate === date && t.schedTime).forEach(t =>
    items.push({ kind: 'task', id: t.id, title: t.title, areaId: t.areaId, start: toMin(t.schedTime), dur: t.est || 30, done: t.done }));
  routinesOn(date).filter(r => r.time).forEach(r =>
    items.push({ kind: 'routine', id: r.id, title: r.title, areaId: r.areaId, start: toMin(r.time), dur: r.est || 30, done: !!S.routineDone[r.id + '|' + date] }));
  return items.sort((a, b) => a.start - b.start || b.dur - a.dur);
}
const scheduledElsewhere = (t, d) => t.schedTime && t.schedDate && t.schedDate !== d && t.schedDate >= today();
function cmpTask(a, b) {
  return a.priority - b.priority || (a.due || '9999').localeCompare(b.due || '9999') || a.createdAt - b.createdAt;
}
// tasks that need a slot on date d
function needsSlot(d) {
  const t0 = today();
  return S.tasks.filter(t => !t.done && !(t.schedDate === d && t.schedTime) && !scheduledElsewhere(t, d) &&
    ((t.due && t.due <= d) || t.schedDate === d || (d === t0 && t.schedDate && t.schedDate < t0))).sort(cmpTask);
}
// Auto-plan: fill free gaps with the most urgent tasks
function autoPlan(date) {
  const { dayStart, dayEnd } = S.settings;
  let from = dayStart * 60;
  if (date === today()) from = Math.max(from, Math.ceil(nowMin() / 15) * 15);
  if (date < today()) return toast("Can't plan a past day");
  const busy = dayItems(date).filter(i => !i.done).map(i => [i.start, i.start + i.dur]);
  const horizon = addDays(date, 3);
  const cands = S.tasks.filter(t => !t.done && !(t.schedTime && t.schedDate >= today()) &&
    ((t.due && t.due <= horizon) || t.priority === 1 || t.schedDate === date))
    .sort((a, b) => {
      const ua = a.due && a.due <= date ? 0 : 1, ub = b.due && b.due <= date ? 0 : 1;
      return ua - ub || cmpTask(a, b);
    });
  let placed = 0, skipped = 0;
  for (const t of cands) {
    const d = t.est || 30; let s = from;
    busy.sort((a, b) => a[0] - b[0]);
    for (const [b0, b1] of busy) { if (s + d <= b0) break; if (b1 > s) s = Math.ceil(b1 / 15) * 15; }
    if (s + d <= dayEnd * 60) { t.schedDate = date; t.schedTime = fromMin(s); t.reminded = null; busy.push([s, s + d]); placed++; }
    else skipped++;
  }
  tlScrolled = false; save(); render();
  toast(placed ? `Planned ${placed} task${placed > 1 ? 's' : ''}${skipped ? ` · ${skipped} didn't fit` : ''}` : (skipped ? 'No free time left today' : 'Nothing urgent to plan'));
}
function clearPlan(date) {
  let n = 0;
  S.tasks.forEach(t => { if (t.schedDate === date && t.schedTime && !t.done) { t.schedTime = null; t.schedDate = null; n++; } });
  save(); render(); toast(`Unscheduled ${n} task${n === 1 ? '' : 's'}`);
}
function layout(items) {
  const clusters = []; let cur = [], end = -1;
  for (const it of items) {
    if (it.start >= end && cur.length) { clusters.push(cur); cur = []; }
    cur.push(it); end = Math.max(end, it.start + it.dur);
  }
  if (cur.length) clusters.push(cur);
  for (const c of clusters) {
    const cols = [];
    for (const it of c) {
      let i = cols.findIndex(e => e <= it.start);
      if (i < 0) { i = cols.length; cols.push(0); }
      cols[i] = it.start + it.dur; it.col = i;
    }
    c.forEach(it => it.ncol = cols.length);
  }
}

/* ---------- rendering ---------- */
function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === view));
  $('#fab').style.display = view === 'focus' ? 'none' : '';
  ({ today: renderToday, tasks: renderTasks, goals: renderGoals, routines: renderRoutines, focus: renderFocus })[view]();
  renderPill(); renderLvl();
}

function dueLabel(t) {
  const t0 = today(), out = [];
  if (t.start && t.start > t0 && !t.done) out.push(`Starts ${fmtShort(t.start)}`);
  if (t.start && t.start < t0 && !t.due && !t.done) out.push(`since ${fmtShort(t.start)}`);
  if (t.due) {
    const n = Math.round((parseYmd(t.due) - parseYmd(t0)) / 864e5);
    if (t.done) out.push(`Due ${fmtShort(t.due)}`);
    else if (n < 0) out.push(`<span class="od">Overdue ${-n}d</span>`);
    else if (n === 0) out.push(`<span class="od">Due today</span>`);
    else if (n === 1) out.push(`<b>Due tomorrow</b>`);
    else out.push(`${n} days left · ${fmtShort(t.due)}`);
  }
  return out;
}
function taskRow(t) {
  const ar = area(t.areaId);
  const meta = [`<i style="background:${ar.color}"></i>${esc(ar.name)}`, ...dueLabel(t)];
  if (t.schedTime && t.schedDate && !t.done) meta.push(`⏰ ${t.schedDate === today() ? '' : fmtShort(t.schedDate) + ' '}${fmtTime(t.schedTime)}`);
  if (t.remind && !t.done) meta.push('🔔');
  if (t.goalId) { const g = S.goals.find(g => g.id === t.goalId); if (g) meta.push('🎯 ' + esc(g.title)); }
  return `<div class="row ${t.done ? 'done' : ''}"><button class="chk" data-act="tog" data-id="${t.id}" style="--c:${ar.color}" aria-label="Toggle done">${t.done ? '✓' : ''}</button>
  <div class="rb" data-act="edit" data-id="${t.id}"><div class="rt">${t.priority === 1 ? '<span class="p1">!</span> ' : ''}${esc(t.title)}</div><div class="rm">${meta.join(' · ')}</div></div></div>`;
}
function daysLabel(ds) {
  const s = [...ds].sort().join('');
  if (s === '0123456') return 'Every day';
  if (s === '12345') return 'Weekdays';
  if (s === '06') return 'Weekends';
  return [1, 2, 3, 4, 5, 6, 0].filter(d => ds.includes(d)).map(d => DN[d]).join(' ');
}
function routineRow(r, date) {
  const ar = area(r.areaId), on = date && r.days.includes(parseYmd(date).getDay());
  const done = on && S.routineDone[r.id + '|' + date];
  return `<div class="row ${done ? 'done' : ''}">${on ? `<button class="chk" data-act="rtog" data-id="${r.id}" style="--c:${ar.color}" aria-label="Toggle done">${done ? '✓' : ''}</button>` : `<span class="chk" style="--c:${ar.color};opacity:.35"></span>`}
  <div class="rb" data-act="redit" data-id="${r.id}"><div class="rt">↻ ${esc(r.title)}</div><div class="rm"><i style="background:${ar.color}"></i>${esc(ar.name)} · ${daysLabel(r.days)}${r.time ? ' · ' + fmtTime(r.time) : ''}${r.remind ? ' · 🔔' : ''}</div></div></div>`;
}

// What belongs on a given day's checklist
function dayLists(d) {
  const t0 = today(), open = S.tasks.filter(t => !t.done), used = new Set();
  const take = arr => { arr.forEach(t => used.add(t.id)); return arr; };
  const tm = t => t.schedDate === d && t.schedTime || '99';
  const sorter = (a, b) => tm(a).localeCompare(tm(b)) || a.priority - b.priority || (a.due || '9').localeCompare(b.due || '9');
  const laterPlanned = t => t.schedDate && t.schedDate > d;
  const overdue = d === t0 ? take(open.filter(t => t.due && t.due < t0 && !laterPlanned(t)).sort(sorter)) : [];
  const dueToday = take(open.filter(t => !used.has(t.id) && t.due === d).sort(sorter));
  const todo = take(open.filter(t => !used.has(t.id) && !laterPlanned(t) && (
    t.schedDate === d ||
    (d === t0 && t.schedDate && t.schedDate < t0) ||
    (t.start && t.start <= d && (!t.due || t.due > d)) ||
    (!t.start && !t.schedDate && t.due && t.due > d && t.due <= addDays(d, 7)))).sort(sorter));
  const done = S.tasks.filter(t => t.done && t.doneAt && ymd(new Date(t.doneAt)) === d);
  return { overdue, dueToday, todo, done };
}

/* quick-add state: write it, set start / done-by / time right away */
let QA = null;
function qaReset() { QA = { start: day, due: null, time: '', area: QA ? QA.area : (S.settings.lastArea || S.areas[0]?.id) }; }
function qaHTML() {
  const t0 = today(), chip = (grp, val, label, cur) => `<button type="button" class="chip ${cur === val ? 'on' : ''}" data-act="qset" data-id="${grp}|${val}">${label}</button>`;
  const nextMon = (() => { let x = addDays(t0, 1); while (parseYmd(x).getDay() !== 1) x = addDays(x, 1); return x; })();
  const s = QA.start, du = QA.due;
  return `<form id="qa" class="card qbox">

/* ---------- growth: XP, levels, streak, tree ---------- */
const XPP = { 1: 30, 2: 20, 3: 10 };
const LVL = l => 100 + 50 * (l - 1);
const STAGES = [[1, 'Seed'], [2, 'Sprout'], [4, 'Seedling'], [6, 'Sapling'], [9, 'Young tree'], [13, 'Tree'], [18, 'Great tree'], [25, 'Ancient tree']];
function levelOf(xp) { let l = 1, need = LVL(1); while (xp >= need) { xp -= need; l++; need = LVL(l); } return { l, into: xp, need }; }
const stageOf = l => STAGES.filter(s => l >= s[0]).pop()[1];
function addXP(n, areaId) {
  const X = S.xp, before = levelOf(X.total).l;
  X.total = Math.max(0, X.total + n);
  if (areaId) X.byArea[areaId] = Math.max(0, (X.byArea[areaId] || 0) + n);
  const d = today(); X.days[d] = Math.max(0, (X.days[d] || 0) + (n > 0 ? 1 : -1)); if (!X.days[d]) delete X.days[d];
  const after = levelOf(X.total).l;
  if (after > before) setTimeout(() => {
    notify(`Level ${after}! 🌳`, `Your tree grew${stageOf(after) !== stageOf(before) ? ' into a ' + stageOf(after) : ''}. Keep going!`);
    if (navigator.vibrate) navigator.vibrate([100, 60, 100, 60, 250]);
  }, 400);
}
function streak() {
  let d = today(), n = 0;
  if (!S.xp.days[d]) d = addDays(d, -1);
  while (S.xp.days[d] > 0) { n++; d = addDays(d, -1); }
  return n;
}
const goalsDone = () => S.goals.filter(g => { const st = goalStats(g); return st.total && st.done === st.total; }).length;
function treeSVG() {
  const lv = levelOf(S.xp.total).l, W = 320, H = 270, GY = H - 34;
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const ar = S.areas.filter(a => (S.xp.byArea[a.id] || 0) > 0), tot = ar.reduce((s, a) => s + S.xp.byArea[a.id], 0);
  const pick = () => { if (!tot) return '#5cb85c'; let r = rnd() * tot; for (const a of ar) { r -= S.xp.byArea[a.id]; if (r <= 0) return a.color; } return ar[0].color; };
  let br = '', lf = ''; const tips = [];
  const depth = Math.min(7, 1 + Math.floor(lv / 2)), len = Math.min(60, 16 + lv * 4);
  function grow(x, y, l, ang, d) {
    const x2 = x + l * Math.sin(ang), y2 = y - l * Math.cos(ang);
    br += `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke-width="${Math.max(1.4, d * 1.9).toFixed(1)}"/>`;
    if (d <= 1) {
      const n = lv < 3 ? 2 : 3;
      for (let i = 0; i < n; i++) { const lx = x2 + (rnd() - .5) * 12, ly = y2 + (rnd() - .5) * 10; tips.push([lx, ly]); lf += `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="${(4 + rnd() * 3.5).toFixed(1)}" fill="${pick()}" opacity=".9"/>`; }
    } else {
      const sp = .32 + rnd() * .22;
      grow(x2, y2, l * .74, ang - sp, d - 1); grow(x2, y2, l * .74, ang + sp, d - 1);
      if (d > 3 && rnd() > .55) grow(x2, y2, l * .6, ang + (rnd() - .5) * .4, d - 2);
    }
  }
  if (lv === 1) {
    const p = Math.min(1, S.xp.total / LVL(1));
    br = `<ellipse cx="160" cy="${GY - 4}" rx="9" ry="6" fill="#8b5a2b"/>` + (p > 0 ? `<path d="M160 ${GY - 8} q-2 -${10 + p * 14} ${-8} -${12 + p * 16}" stroke="#4caf50" stroke-width="3" fill="none"/><ellipse cx="${150}" cy="${GY - 22 - p * 16}" rx="7" ry="4" fill="#5cb85c" transform="rotate(-30 150 ${GY - 22 - p * 16})"/>` : '');
  } else grow(W / 2, GY, len, 0, depth);
  const fruits = Math.min(goalsDone(), tips.length);
  let fr = ''; for (let i = 0; i < fruits; i++) { const [x, y] = tips[Math.floor((i * 7919) % tips.length)]; fr += `<circle cx="${x.toFixed(1)}" cy="${(y + 4).toFixed(1)}" r="6" fill="#ffc83d" stroke="#d99a00" stroke-width="1.5"/>`; }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-height:300px" role="img" aria-label="Your growth tree, level ${lv}">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sky1)"/><stop offset="1" stop-color="var(--sky2)"/></linearGradient></defs>
  <rect width="${W}" height="${H}" rx="14" fill="url(#sky)"/>
  <ellipse cx="160" cy="${GY + 22}" rx="190" ry="34" fill="var(--hill)"/>
  <g stroke="#7a4a24" stroke-linecap="round">${br}</g><g>${lf}</g><g>${fr}</g></svg>`;
}
function growCard() {
  const L = levelOf(S.xp.total), st = streak(), ar = S.areas.filter(a => (S.xp.byArea[a.id] || 0) > 0);
  return `<div class="card" style="padding:10px">${treeSVG()}
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:10px"><b style="font-size:18px">Level ${L.l} · ${stageOf(L.l)}</b><span>${st ? `🔥 ${st}-day streak` : '<span class="muted">Finish 1 thing to start a streak</span>'}</span></div>

  <p class="hint" style="margin-bottom:0">High +30 · Normal +20 · Low +10 · Routine +10 · Focus +15 · Milestone +50 · Goal done +150</p></div>`;

/* ---------- focus timer ---------- */

  return S.timer;
}
const remaining = () => { const t = T(); return t.running ? Math.max(0, Math.round((t.end - Date.now()) / 1000)) : t.remaining; };
const fullLen = () => (T().mode === 'work' ? S.settings.pomo : S.settings.brk) * 60;

function fReset() { const t = T(); t.running = false; t.remaining = fullLen(); save(); render(); }

}

  $('#view').innerHTML = `<h2>Focus</h2>

/* ---------- reminders & notifications ---------- */
function askNotify() { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); }
async function notify(title, body) {
  toast(title + (body ? ' — ' + body : ''));
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      const reg = await navigator.serviceWorker.ready;
      reg.showNotification(title, { body, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', vibrate: [200, 100, 200], tag: title + body });
    } else new Notification(title, { body });
  } catch (e) { }
}
function checkReminders() {
  const d = today(), m = nowMin(), lead = S.settings.lead;
  let changed = false;
  const fire = (obj, kind, time, dur) => {
    const key = d + ' ' + time, st = toMin(time);
    if (m >= st - lead && m < st + dur && obj.reminded !== key) {
      obj.reminded = key; changed = true;
      const mins = st - m;
      notify(obj.title, `${area(obj.areaId).name} · ${mins > 0 ? 'starts in ' + mins + ' min' : 'now'}`);
    }
  };
  S.tasks.forEach(t => { if (t.remind && !t.done && t.schedDate === d && t.schedTime) fire(t, 'task', t.schedTime, t.est || 30); });
  routinesOn(d).forEach(r => { if (r.remind && r.time && !S.routineDone[r.id + '|' + d]) fire(r, 'routine', r.time, r.est || 30); });
  // daily nudges while the app is open / recently used
  const N = S.settings.nudged || (S.settings.nudged = {});
  for (const k in N) if (k < addDays(d, -3)) delete N[k];
  const L = dayLists(d), left = L.overdue.length + L.dueToday.length + L.todo.length;
  if (S.settings.morning && m >= toMin(S.settings.morning) && m < toMin(S.settings.morning) + 120 && !N[d + 'm']) {
    N[d + 'm'] = 1; changed = true;
    notify('☀️ Good morning', left ? `${left} thing${left > 1 ? 's' : ''} on your list today${L.dueToday.length ? ` · ${L.dueToday.length} due today` : ''}` : 'Your list is clear. Add what matters today.');
  }
  if (S.settings.evening && m >= toMin(S.settings.evening) && m < toMin(S.settings.evening) + 120 && !N[d + 'e']) {
    N[d + 'e'] = 1; changed = true;
    const st = streak(), doneToday = S.xp.days[d] > 0;
    notify('🌙 Evening check-in', doneToday ? `Nice work today 🔥 ${st}-day streak. ${left ? left + ' left — check off what you finished.' : 'All clear!'}` : `Finish one thing to ${st ? 'keep your 🔥 ' + st + '-day streak' : 'start a streak'} 🌱`);
  }
  if (changed) save();
}

/* ---------- calendar export (.ics) — reliable reminders via your phone's calendar ---------- */
const icsEsc = s => String(s || '').replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
const icsDT = (d, m) => d.replace(/-/g, '') + 'T' + fromMin(Math.min(m, 1439)).replace(':', '') + '00';
const stamp = () => new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
function icsTask(t) {
  if (!(t.schedDate && t.schedTime) && !t.due) return null;
  const L = ['BEGIN:VEVENT', 'UID:' + t.id + '@juggle', 'DTSTAMP:' + stamp(), 'SUMMARY:' + icsEsc(t.title), 'DESCRIPTION:' + icsEsc(area(t.areaId).name + (t.notes ? '\n' + t.notes : ''))];
  if (t.schedDate && t.schedTime) { const s = toMin(t.schedTime); L.push('DTSTART:' + icsDT(t.schedDate, s), 'DTEND:' + icsDT(t.schedDate, s + (t.est || 30))); }
  else L.push('DTSTART;VALUE=DATE:' + t.due.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + addDays(t.due, 1).replace(/-/g, ''));
  L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(t.title), 'TRIGGER:' + (t.schedTime && t.schedDate ? '-PT' + S.settings.lead + 'M' : 'PT9H'), 'END:VALARM', 'END:VEVENT');
  return L.join('\r\n');
}
function icsRoutine(r) {
  const BY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
  let d = today(); while (!r.days.includes(parseYmd(d).getDay())) d = addDays(d, 1);
  const L = ['BEGIN:VEVENT', 'UID:' + r.id + '@juggle', 'DTSTAMP:' + stamp(), 'SUMMARY:' + icsEsc(r.title), 'DESCRIPTION:' + icsEsc(area(r.areaId).name), 'RRULE:FREQ=WEEKLY;BYDAY=' + r.days.map(x => BY[x]).join(',')];
  if (r.time) { const s = toMin(r.time); L.push('DTSTART:' + icsDT(d, s), 'DTEND:' + icsDT(d, s + (r.est || 30))); if (r.remind) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(r.title), 'TRIGGER:-PT' + S.settings.lead + 'M', 'END:VALARM'); }
  else L.push('DTSTART;VALUE=DATE:' + d.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + addDays(d, 1).replace(/-/g, ''));
  L.push('END:VEVENT'); return L.join('\r\n');
}
const wrapIcs = evs => ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Juggle//EN', 'CALSCALE:GREGORIAN', ...evs, 'END:VCALENDAR'].join('\r\n');
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

  <div class="btns"><button class="pri" type="button" data-act="ccopy">1 · Copy for Claude</button></div>
  <p class="muted">2 · Paste it in the Claude app and send.${chat ? ' Chat with Claude, answer its questions, adjust the plan. When you like it:' : ''}</p>
  ${chat ? `<div class="btns" style="margin-top:4px"><button type="button" data-act="cfinish">Copy "give me the final plan"</button></div>` : ''}
  <textarea id="cout" readonly hidden style="min-height:120px;font-size:13px"></textarea>
  <label style="margin-top:12px">3 · Paste Claude's final reply<textarea id="cin" placeholder="Juggle finds the json part automatically" style="min-height:100px"></textarea></label>
  <div class="btns"><button class="pri" type="button" data-act="cimport">Add to my app</button></div>
  <p class="muted" style="margin-top:12px">Only what you copy leaves your phone, and only when you paste it.</p>`);
  $('#cnote').oninput = e => claudeNote = e.target.value;
}
function claudeCopy() {
  const txt = claudePrompt($('#cnote').value);
  const show = () => { const o = $('#cout'); o.hidden = false; o.value = txt; o.focus(); o.select(); toast('Select all & copy, then open Claude'); };
  try { navigator.clipboard.writeText(txt).then(() => toast('Copied ✓ Now paste it into Claude'), show); } catch (e) { show(); }
}
function claudeImport() {
  const raw = $('#cin').value;
  const blocks = [...raw.matchAll(/```(?:json)?\s*([\s\S]*?)```/g)].map(x => x[1]);
  let data = null;
  for (const b of [...blocks.reverse(), (raw.match(/(\{[\s\S]*\})/) || [])[1], raw]) { try { if (b) { data = JSON.parse(b); break; } } catch (e) { } }
  if (!data || typeof data !== 'object') return toast("Couldn't find the json block in that reply");
  const isD = v => /^\d{4}-\d{2}-\d{2}$/.test(v || ''), isT = v => /^\d{1,2}:\d{2}$/.test(v || '');
  const nt = v => isT(v) ? v.padStart(5, '0') : null;
  const findArea = n => { n = String(n || '').toLowerCase(); return (S.areas.find(a => a.name.toLowerCase() === n) || S.areas.find(a => n && n.includes(a.name.toLowerCase().split(/[ /]/)[0])) || S.areas[0]).id; };
  const mkTask = (x, extra) => {
    const start = isD(x.start) ? x.start : (isD(x.date) ? x.date : null), time = nt(x.time);
    let due = isD(x.due) ? x.due : null; if (due && start && due < start) due = start;
    return Object.assign({
      id: uid(), title: String(x.title).trim().slice(0, 200), areaId: findArea(x.area), priority: [1, 2, 3].includes(+x.priority) ? +x.priority : 2,
      start, due, est: Math.min(480, Math.max(5, +x.est || +x.minutes || 30)), schedDate: time && start ? start : (isD(x.date) ? x.date : null), schedTime: time && start ? time : null,
      remind: !!time, notes: 'Added by Claude', done: false, createdAt: Date.now(), focusMin: 0
    }, extra);
  };
  const DMAP = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
  claudeUndo = JSON.stringify(S);
  let moved = 0, added = 0, skipped = 0, goalName = '', rAdded = 0;
  (Array.isArray(data.schedule) ? data.schedule : []).forEach(x => {
    const t = S.tasks.find(t => t.id === x.id);
    if (!t || !isD(x.date)) return skipped++;
    t.schedDate = x.date; t.schedTime = nt(x.time); t.reminded = null; moved++;
  });
  (Array.isArray(data.newTasks) ? data.newTasks : []).forEach(x => {
    if (!x || !String(x.title || '').trim()) return skipped++;
    S.tasks.push(mkTask(x)); added++;
  });
  let gid = null;
  if (data.goal && String(data.goal.title || '').trim()) {
    const g = data.goal; gid = uid(); goalName = String(g.title).trim();
    const areaId = findArea(g.area), ms = [];
    (Array.isArray(g.milestones) ? g.milestones : []).forEach(m => {
      const mid = uid(); ms.push({ id: mid, title: String(m.title || 'Step').trim().slice(0, 120) });
      (Array.isArray(m.tasks) ? m.tasks : []).forEach(x => {
        if (!x || !String(x.title || '').trim()) return skipped++;
        S.tasks.push(mkTask(Object.assign({ area: g.area }, x), { goalId: gid, msId: mid, areaId: x.area ? findArea(x.area) : areaId })); added++;
      });
    });
    S.goals.push({ id: gid, title: goalName.slice(0, 120), areaId, why: String(g.why || '').slice(0, 300), milestones: ms, createdAt: Date.now() });
  }
  (Array.isArray(data.routines) ? data.routines : []).forEach(r => {
    const days = (Array.isArray(r.days) ? r.days : []).map(d => DMAP[String(d).slice(0, 3).toLowerCase()]).filter(d => d !== undefined);
    if (!r || !String(r.title || '').trim() || !days.length) return skipped++;
    S.routines.push({ id: uid(), title: String(r.title).trim().slice(0, 120), areaId: findArea(r.area || (data.goal && data.goal.area)), days: [...new Set(days)], time: nt(r.time), est: Math.min(480, Math.max(5, +r.minutes || 30)), remind: !!nt(r.time), active: true, goalId: gid });
    rAdded++;
  });
  if (!moved && !added && !rAdded && !gid) { claudeUndo = null; return toast('Nothing to import — ask Claude for the json block'); }
  claudeNote = ''; save(); tlScrolled = false;
  if (gid) view = 'goals';
  render();
  const parts = [goalName && `🎯 Goal "${esc(goalName)}"`, added && `${added} to-do${added > 1 ? 's' : ''} added`, moved && `${moved} placed on days`, rAdded && `${rAdded} routine${rAdded > 1 ? 's' : ''}`, skipped && `${skipped} skipped`].filter(Boolean);
  openSheet(`<h2>Added ✓</h2><p>${parts.join(' · ')}</p>
  <div class="btns">${gid ? `<button class="pri" type="button" data-act="goal" data-id="${gid}">See the roadmap</button>` : `<button class="pri" type="button" data-act="cclose">Looks good</button>`}<button type="button" class="danger" data-act="cundo">Undo</button></div>`);
}

/* ---------- actions ---------- */
function ask(msg, yes = 'Delete') {
  return new Promise(res => {
    $('#dlgmsg').textContent = msg; $('#dlgyes').textContent = yes; $('#dlg').classList.add('open');
    const done = v => { $('#dlg').classList.remove('open'); $('#dlgyes').onclick = $('#dlgno').onclick = null; res(v); };
    $('#dlgyes').onclick = () => done(true); $('#dlgno').onclick = () => done(false);
  });
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

const actions = {
  add: () => view === 'routines' ? routineForm() : view === 'goals' ? (claudeMode = 'skill', claudeSheet()) : taskForm(),
  edit: id => taskForm(id),
  redit: id => routineForm(id),
  tog: id => {
    const t = S.tasks.find(x => x.id === id); if (!t) return;
    t.done = !t.done; t.doneAt = t.done ? Date.now() : null;
    let msg = '';
    if (t.done) {
      let n = XPP[t.priority] || 20; msg = `Done ✓ +${n} XP`;
      if (t.goalId) {
        if (t.msId && S.tasks.filter(x => x.msId === t.msId).every(x => x.done)) { n += 50; msg = `🏁 Milestone reached! +${n} XP`; }
        if (S.tasks.filter(x => x.goalId === t.goalId).every(x => x.done)) { n += 150; msg = `🍋 Goal complete! +${n} XP — a fruit grew on your tree`; }
      }
      t.xp = n; addXP(n, t.areaId);
    } else { addXP(-(t.xp || 0), t.areaId); t.xp = 0; }
    const g = openGoal; save(); closeSheet(); render(); if (g) goalSheet(g); if (msg) toast(msg);
  },
  rtog: id => {
    const k = id + '|' + (view === 'routines' ? today() : day);
    const r = S.routines.find(x => x.id === id);
    if (S.routineDone[k]) { delete S.routineDone[k]; addXP(-10, r && r.areaId); } else { S.routineDone[k] = true; addXP(10, r && r.areaId); toast('Routine done ✓ +10 XP'); }
    save(); closeSheet(); render();
  },
  del: async id => { if (!await ask('Delete this task?')) return; S.tasks = S.tasks.filter(t => t.id !== id); save(); closeSheet(); render(); },
  rdel: async id => { if (!await ask('Delete this routine?')) return; S.routines = S.routines.filter(r => r.id !== id); save(); closeSheet(); render(); },
  dprev: () => { day = addDays(day, -1); tlScrolled = false; render(); },
  dnext: () => { day = addDays(day, 1); tlScrolled = false; render(); },
  dtoday: () => { day = today(); tlScrolled = false; render(); },
  plan: () => autoPlan(day),
  clearplan: async () => { if (await ask('Unschedule all open tasks on this day? Routines stay.', 'Unschedule')) clearPlan(day); },
  filter: id => { filterArea = id; render(); },
  fstart: fStart, fpause: fPause, freset: fReset, fskip: switchMode,
  focustask: id => { const t = T(); t.taskId = id; if (!t.running) { t.mode = 'work'; t.remaining = fullLen(); } save(); closeSheet(); view = 'focus'; render(); },
  gofocus: () => { view = 'focus'; render(); },
  settings: settingsForm,
  aadd: () => { applySettings(); const cs = ['#e85d75', '#14b8a6', '#eab308', '#64748b', '#8b5cf6']; S.areas.push({ id: uid(), name: 'New area', color: cs[S.areas.length % cs.length] }); save(); settingsForm(); },
  adel: async id => {
    if (S.areas.length < 2) return toast('Keep at least one area');
    const a = area(id), n = S.tasks.filter(t => t.areaId === id).length + S.routines.filter(r => r.areaId === id).length;
    applySettings();
    const rest = S.areas.filter(x => x.id !== id);
    if (!await ask(`Delete "${a.name}"?${n ? ` Its ${n} item(s) move to "${rest[0].name}".` : ''}`)) return;
    S.areas = rest;
    S.tasks.forEach(t => { if (t.areaId === id) t.areaId = rest[0].id; });
    S.routines.forEach(r => { if (r.areaId === id) r.areaId = rest[0].id; });
    if (filterArea === id) filterArea = 'all';
    save(); settingsForm();
  },
  perm: () => Notification.requestPermission().then(() => settingsForm()),
  ics: id => { const e = icsTask(S.tasks.find(t => t.id === id)); if (!e) return toast('Give it a due date or time block first'); download('juggle-task.ics', wrapIcs([e]), 'text/calendar'); },
  ricsone: id => download('juggle-routine.ics', wrapIcs([icsRoutine(S.routines.find(r => r.id === id))]), 'text/calendar'),
  icsnudge: () => {
    applySettings(); save();
    const s = S.settings, evs = [];
    const ev = (id, t, title, body) => { const st = toMin(t); return ['BEGIN:VEVENT', `UID:${id}@juggle`, 'DTSTAMP:' + stamp(), 'SUMMARY:' + icsEsc(title), 'DESCRIPTION:' + icsEsc(body), 'RRULE:FREQ=DAILY', 'DTSTART:' + icsDT(today(), st), 'DTEND:' + icsDT(today(), st + 5), 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(title), 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT'].join('\r\n'); };
    if (s.morning) evs.push(ev('nudge-morning', s.morning, '☀️ Plan your day in Juggle', 'Open Juggle and look at today\'s list.'));
    if (s.evening) evs.push(ev('nudge-evening', s.evening, '🌙 Check off today in Juggle', 'Mark what you finished — grow your tree and keep your streak.'));
    if (!evs.length) return toast('Set a morning or evening time first');
    download('juggle-daily-nudges.ics', wrapIcs(evs), 'text/calendar'); toast('Open the file to add the nudges to your calendar');
  },
  icsall: () => {
    const t0 = today();
    const evs = S.tasks.filter(t => !t.done && ((t.schedDate && t.schedTime && t.schedDate >= t0) || (t.due && t.due >= t0))).map(icsTask).filter(Boolean)
      .concat(S.routines.filter(r => r.active !== false).map(icsRoutine));
    if (!evs.length) return toast('Nothing upcoming to export');
    download('juggle-upcoming.ics', wrapIcs(evs), 'text/calendar'); toast(`Exported ${evs.length} item(s)`);
  },
  backup: () => download(`juggle-backup-${today()}.json`, JSON.stringify(S, null, 1), 'application/json'),
  restore: () => $('#imp').click(),
  goal: goalSheet,
  gogrow: () => { closeSheet(); view = 'goals'; window.scrollTo(0, 0); render(); },
  claudeskill: () => { claudeMode = 'skill'; claudeSheet(); },
  qset: v => { const [g, val] = v.split('|'); if (g === 's') QA.start = val; else QA.due = val || null; const tv = $('#qat').value; render(); $('#qat').value = tv; },
  gdel: async id => {
    if (!await ask('Delete this goal and its unfinished steps? Finished steps stay in your history.')) return;
    S.tasks = S.tasks.filter(t => !(t.goalId === id && !t.done)); S.tasks.forEach(t => { if (t.goalId === id) t.goalId = null; });
    S.routines = S.routines.filter(r => r.goalId !== id); S.goals = S.goals.filter(g => g.id !== id);
    save(); closeSheet(); render();
  },
  cfinish: () => { const m = "Looks good. Please give me the final plan now as ONE json code block in the format I described."; try { navigator.clipboard.writeText(m).then(() => toast('Copied ✓ Paste it into Claude'), () => toast(m)); } catch (e) { toast(m); } },
  claude: claudeSheet, cmode: k => { claudeNote = $('#cnote').value; claudeMode = k; claudeSheet(); },
  tline: () => { S.settings.showTimeline = !S.settings.showTimeline; tlScrolled = false; save(); render(); }, ccopy: claudeCopy, cimport: claudeImport, cclose: closeSheet,
  cundo: () => { if (claudeUndo) { S = JSON.parse(claudeUndo); claudeUndo = null; save(); render(); toast('Import undone'); } closeSheet(); },
  install: () => { installEvt.prompt(); installEvt = null; closeSheet(); }
};

document.addEventListener('click', e => {
  const tab = e.target.closest('nav button');
  if (tab) { view = tab.dataset.tab; if (view === 'today') tlScrolled = false; window.scrollTo(0, 0); render(); return; }
  if (e.target.id === 'sheet') return closeSheet();
  const el = e.target.closest('[data-act]');
  if (el && actions[el.dataset.act]) { e.preventDefault(); actions[el.dataset.act](el.dataset.id); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'fsel') { T().taskId = e.target.value || null; save(); }
});
$('#imp').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data.areas || !data.tasks) throw 0;
    if (!await ask('Replace all current data with this backup?', 'Replace')) { e.target.value = ''; return; }
    localStorage.setItem(KEY, JSON.stringify(data)); S = load(); save(); closeSheet(); render(); toast('Backup restored');
  } catch (err) { toast("That file isn't a Juggle backup"); }
  e.target.value = '';
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').classList.contains('open')) closeSheet(); });
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (S.timer && S.timer.running && Date.now() >= S.timer.end) fComplete();
    checkReminders();
    if (!$('#sheet').classList.contains('open')) render();
  }
});

/* ---------- tick ---------- */
let lastMin = nowMin();
setInterval(() => {
  const t = S.timer;
  if (t && t.running && Date.now() >= t.end) fComplete();
  if (view === 'focus') updateFocus();
  renderPill();
  const m = nowMin();
  if (m !== lastMin) {
    lastMin = m; checkReminders();
    if (view === 'today' && S.settings.showTimeline && !$('#sheet').classList.contains('open')) { const nl = $('#nowline'); if (nl) nl.style.top = (m - S.settings.dayStart * 60) * 1.2 + 'px'; }
  }
}, 1000);

/* ---------- boot ---------- */
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => { });
try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => { }); } catch (e) { }
render();
checkReminders();
</script>
