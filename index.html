<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Juggle</title>
<style>
:root{--sky1:#1b2a44;--sky2:#2b3d5c;--hill:#24402c;--bg:#0f1115;--card:#181b22;--card2:#232832;--tx:#e8eaf0;--mu:#8b93a7;--ln:#2a2f3a;--ac:#4f8cff;--danger:#ff5d5d;--ok:#2bb673;--goal:#8b7cf6;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--sky1:#cfe8ff;--sky2:#eef7ff;--hill:#a6d68c;--bg:#f4f5f8;--card:#fff;--card2:#eceff4;--tx:#151821;--mu:#626b7f;--ln:#dfe3ea;--goal:#6d5ce8;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--bg);border-bottom:1px solid var(--ln)}
header h1{font-size:19px;margin:0;flex:1;letter-spacing:-.01em}
main{padding:12px 16px 130px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:flex-end;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:8px 0 10px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:20px;line-height:1.2}
nav button.on{color:var(--ac);font-weight:600}
nav .grow span{width:54px;height:54px;margin-top:-26px;border-radius:50%;background:var(--card);border:3px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:26px}
nav .grow.on span{border-color:var(--ok)}
#fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 6px 20px #0006;z-index:6}
.ib{background:var(--card2);border:0;border-radius:10px;padding:7px 11px}
.pill{background:var(--ac);color:#fff;border:0;border-radius:20px;padding:5px 11px;font-size:13px;display:none;font-variant-numeric:tabular-nums}
h2{font-size:19px;margin:4px 0 12px}
h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:20px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}

.row{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:6px}

.rb{flex:1;min-width:0;cursor:pointer}
.rt{overflow-wrap:anywhere}
.rm{font-size:12.5px;color:var(--mu);margin-top:2px}

.p1{color:var(--danger);font-weight:700}
.od{color:var(--danger)}
.xb{flex:none;background:none;border:0;color:var(--mu);padding:2px 4px;font-size:13px}
.subs{margin:-2px 0 8px 34px}
.srow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.srow .chk{width:19px;height:19px;font-size:11px;margin:0}
.srow.done span.t{text-decoration:line-through;color:var(--mu)}
.tag{font-size:11px;padding:1px 7px;border-radius:8px;flex:none}
.tag.hi{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}

.daynav{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.daynav .t{flex:1;text-align:center;cursor:pointer}.daynav b{display:block;font-size:20px}.daynav small{color:var(--mu)}
.prog{font-size:13px;color:var(--mu);text-align:center;margin-bottom:6px}
.bal{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--card2);margin:4px 0 6px}

.blk{position:absolute;border-radius:8px;padding:3px 7px;background:color-mix(in srgb,var(--c) 24%,var(--card));border-left:4px solid var(--c);overflow:hidden;font-size:12.5px;line-height:1.25;cursor:pointer}

.now{position:absolute;left:46px;right:0;border-top:2px solid var(--danger);z-index:2;pointer-events:none}

.gbar{height:7px;border-radius:4px;background:var(--card2);overflow:hidden;margin:8px 0 4px}.gbar i{display:block;height:100%;background:var(--goal)}

textarea{min-height:60px;resize:vertical}

.ed .sec{border-top:1px solid var(--ln);margin-top:12px;padding-top:8px}
.ed .sec>.lbl{font-size:12.5px;color:var(--mu);margin-bottom:6px;display:block}
.ed .ttl{font-size:18px;font-weight:600;border:0;background:none;padding:6px 0;margin:0}

.erow>span{width:62px;flex:none;font-size:12.5px;color:var(--mu)}

.sedit{display:flex;gap:6px;align-items:center;margin:5px 0}

.sedit select{width:auto;margin:0;padding:8px 6px;font-size:13px}

.arow button{flex:none}
.muted{color:var(--mu);font-size:13px}
.ctr{text-align:center}
.ctr .btns{justify-content:center}
.mode{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.pcard{padding:14px}.ovr{width:86px;height:104px;border-radius:14px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#ffe7a3,#e5b23c);color:#4a3405}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.rc{padding:10px;cursor:pointer}.rcn{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rc b{font-size:14px;display:block;line-height:1.2}
.treewrap{overflow:auto;border-radius:16px;max-height:70vh;-webkit-overflow-scrolling:touch}
.tlab,.tlab2{fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:2.5px;stroke-linejoin:round}
svg[data-th=light] .tlab,svg[data-th=light] .tlab2{fill:#1b2333;stroke:rgba(255,255,255,.85)}
.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.1)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.hrow{display:flex;gap:8px;font-size:13.5px;padding:4px 0;border-top:1px solid var(--ln)}
#toast{position:fixed;left:50%;bottom:calc(156px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#dlg{position:fixed;inset:0;background:#0009;z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
#dlg.open{display:flex}
#dlg .box{background:var(--card);border-radius:16px;padding:18px;max-width:360px;width:100%}
#dlg p{margin:0 0 6px;font-size:16px}
</style>

<body>
<header>
  <h1>Juggle</h1>
  <button id="pill" class="pill" data-act="gofocus"></button>
  <button class="ib" id="lvl" data-act="gogrow" aria-label="Level and streak"></button>
  <button class="ib" data-act="settings" aria-label="Settings">⚙︎</button>
</header>
<main id="view"></main>
<button id="fab" data-act="add" aria-label="Add">+</button>
<nav>
  <button data-tab="today"><span>☀︎</span>Today</button>
  <button data-tab="tasks"><span>☑︎</span>Tasks</button>
  <button data-tab="grow" class="grow"><span>🌱</span>Grow</button>
  <button data-tab="routines"><span>↻</span>Routines</button>
  <button data-tab="more"><span>⋯</span>More</button>
</nav>
<div id="sheet"></div>
<div id="toast"></div>
<div id="dlg"><div class="box"><p id="dlgmsg"></p><div class="btns"><button id="dlgno">Cancel</button><button id="dlgyes" class="danger">OK</button></div></div></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script>
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fromMin = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const today = () => ymd(new Date());
const nowMin = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDur = m => m < 60 ? m + 'm' : (m % 60 ? Math.floor(m / 60) + 'h' + (m % 60) + 'm' : m / 60 + 'h');
const fmtShort = s => s === today() ? 'Today' : s === addDays(today(), 1) ? 'Tomorrow' : parseYmd(s).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const fmtTime = t => { const m = toMin(t), h = Math.floor(m / 60); return `${h % 12 || 12}:${pad(m % 60)}${h < 12 ? 'a' : 'p'}`; };
const DN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const ORD = n => n === -1 ? 'last' : n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
const nextMonday = () => { let x = addDays(today(), 1); while (parseYmd(x).getDay() !== 1) x = addDays(x, 1); return x; };

/* ---------- state (stored only on this device) ---------- */
const KEY = 'juggle.v1';
const DEFAULT = {
  areas: [
    { id: 'a1', name: 'Work', color: '#4f8cff' },
    { id: 'a2', name: '1st Providence', color: '#2bb673' },
    { id: 'a3', name: 'VCU / Classes', color: '#f2994a' },
    { id: 'a4', name: 'Personal', color: '#b06ce0' }
  ],
  tasks: [], routines: [], goals: [], routineDone: {}, routineSubDone: {}, focusLog: [], timer: null, xpLog: [],
  xp: { total: 0, byArea: {}, days: {} },
  settings: { dayStart: 6, dayEnd: 23, pomo: 25, brk: 5, lead: 10, lastArea: null, morning: '07:30', evening: '20:30', nudged: {}, lang: 'en' }
};
let S = load();
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.areas) {
      const m = Object.assign(structuredClone(DEFAULT), s);
      m.settings = Object.assign({}, DEFAULT.settings, s.settings);
      m.xp = Object.assign({ total: 0, byArea: {}, days: {} }, s.xp);
      if (!Array.isArray(m.xpLog)) m.xpLog = [];
      m.areas.forEach(a => { if (a.name === 'Vocational School') a.name = 'Work'; });
      m.tasks.forEach(t => { if (!Array.isArray(t.subs)) t.subs = []; });
      m.routines.forEach(r => { if (!r.rep) r.rep = { type: 'weekly', every: 1, days: r.days || [1, 2, 3, 4, 5] }; });
      const cut = addDays(today(), -70);
      for (const k in m.routineDone) if (k.split('|')[1] < cut) delete m.routineDone[k];
      for (const k in m.routineSubDone) if (k.split('|')[1] < cut) delete m.routineSubDone[k];
      m.routines.forEach(r => { if (!Array.isArray(r.subs)) r.subs = []; });
      m.focusLog = m.focusLog.filter(l => l.date >= cut);
      return m;
    }
  } catch (e) { }
  return structuredClone(DEFAULT);
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Could not save — storage full?'); }
}
const area = id => S.areas.find(a => a.id === id) || { name: 'No area', color: '#888' };
const cmpTask = (a, b) => a.priority - b.priority || (a.due || '9999').localeCompare(b.due || '9999') || a.createdAt - b.createdAt;

/* ---------- routines: flexible repeats ---------- */
function weekStart(d) { const x = parseYmd(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return ymd(x); }
const periodKey = (r, d) => r.rep.per === 'month' ? d.slice(0, 7) : weekStart(d);
function doneCountIn(r, d) {
  const p = periodKey(r, d); let n = 0;
  for (const k in S.routineDone) { const [id, dd] = k.split('|'); if (id === r.id && periodKey(r, dd) === p) n++; }
  return n;
}
function occurs(r, d) {
  if (r.active === false) return false;
  if (r.start && d < r.start) return false;
  const rp = r.rep, dt = parseYmd(d), wd = dt.getDay();
  const last = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
  switch (rp.type) {
    case 'weekly': {
      if (!(rp.days || []).includes(wd)) return false;
      const ev = rp.every || 1; if (ev === 1) return true;
      const a = weekStart(r.start || ymd(new Date(r.createdAt || Date.now())));
      const diff = Math.round((parseYmd(weekStart(d)) - parseYmd(a)) / (7 * 864e5));
      return ((diff % ev) + ev) % ev === 0;
    }
    case 'monthDate': return (rp.mdays || []).some(m => Math.min(m, last) === dt.getDate());
    case 'monthWeekday': {
      if (wd !== rp.wd) return false;
      if (rp.nth === -1) return dt.getDate() + 7 > last;
      return Math.ceil(dt.getDate() / 7) === rp.nth;
    }
    case 'count': {
      if (S.routineDone[r.id + '|' + d]) return true;
      if (!inWindow(r, d)) return false;
      return doneCountIn(r, d) < (rp.times || 1);
    }
  }
  return false;
}
const routinesOn = d => S.routines.filter(r => occurs(r, d)).sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
function daysLabel(ds) {
  const s = [...ds].sort().join('');
  if (s === '0123456') return 'Every day';
  if (s === '12345') return 'Weekdays';
  if (s === '06') return 'Weekends';
  return [1, 2, 3, 4, 5, 6, 0].filter(d => ds.includes(d)).map(d => DN[d]).join(' ');
}
function inWindow(r, d) {
  const rp = r.rep, dt = parseYmd(d);
  if (rp.per === 'week') return !(rp.days && rp.days.length) || rp.days.includes(dt.getDay());
  if (rp.from) return dt.getDate() >= rp.from && dt.getDate() <= (rp.to || 31);
  return true;
}
function lastChance(r, d) {
  if (r.rep.type !== 'count' || S.routineDone[r.id + '|' + d]) return false;
  const p = periodKey(r, d);
  for (let x = addDays(d, 1), i = 0; i < 31 && periodKey(r, x) === p; x = addDays(x, 1), i++) if (inWindow(r, x)) return false;
  return true;
}
function repLabel(r) {
  const p = r.rep;
  switch (p.type) {
    case 'weekly': return (p.every > 1 ? `Every ${p.every} weeks · ` : '') + daysLabel(p.days || []);
    case 'monthDate': return 'Monthly · the ' + (p.mdays || []).map(ORD).join(', ');
    case 'monthWeekday': return `Monthly · ${ORD(p.nth)} ${DN[p.wd]}`;
    case 'count': return `${p.times}× a ${p.per}` + (p.per === 'week' && p.days && p.days.length ? ' · ' + daysLabel(p.days) : p.per === 'month' && p.from ? ` · ${ORD(p.from)}–${ORD(p.to || 31)}` : '');
  }
  return '';
}

/* ---------- day lists ---------- */
function dayLists(d) {
  const t0 = today(), open = S.tasks.filter(t => !t.done && !t.archived), used = new Set();
  const take = arr => { arr.forEach(t => used.add(t.id)); return arr; };
  const tm = t => t.schedDate === d && t.schedTime || '99';
  const sorter = (a, b) => tm(a).localeCompare(tm(b)) || a.priority - b.priority || (a.due || '9').localeCompare(b.due || '9');
  const laterPlanned = t => t.schedDate && t.schedDate > d;
  const overdue = d === t0 ? take(open.filter(t => t.due && t.due < t0 && !laterPlanned(t)).sort(sorter)) : [];
  const dueToday = take(open.filter(t => !used.has(t.id) && t.due === d).sort(sorter));
  const todo = take(open.filter(t => !used.has(t.id) && !laterPlanned(t) && (
    t.schedDate === d ||
    (d === t0 && t.schedDate && t.schedDate < t0) ||
    (t.start && t.start <= d && (!t.due || t.due > d)) ||
    (!t.start && !t.schedDate && t.due && t.due > d && t.due <= addDays(d, 7)))).sort(sorter));
  const done = S.tasks.filter(t => t.done && t.doneAt && ymd(new Date(t.doneAt)) === d);
  return { overdue, dueToday, todo, done };
}

/* ---------- growth: XP, levels, streak ---------- */
const XPP = { 1: 30, 2: 20, 3: 10 }, SXP = { 1: 15, 2: 10, 3: 5 };
const LVL = l => 100 + 50 * (l - 1);

function goalStats(g) {

/* ---------- completing things ---------- */
function completeTask(t) {
  if (t.done) return '';
  t.done = true; t.doneAt = Date.now();
  let n = XPP[t.priority] || 20, msg = `Done ✓ +${n} XP`;
  let subXP = 0;
  t.subs.forEach(s => { if (!s.done) { s.done = true; s.xp = SXP[s.priority] || 10; subXP += s.xp; addXP(s.xp, t.areaId, { t: s.title + ' (' + t.title + ')', k: 'sub', ref: t.id + '|' + s.id }); } });
  if (subXP) msg = `Done ✓ +${n + subXP} XP`;
  if (t.goalId) {
    if (t.msId && S.tasks.filter(x => x.msId === t.msId).every(x => x.done)) { n += 50; msg = `🏁 Milestone reached! +${n + subXP} XP`; }
    if (S.tasks.filter(x => x.goalId === t.goalId).every(x => x.done)) { n += 150; msg = `🍋 Goal complete! +${n + subXP} XP — a fruit grew on your tree`; }
  }
  t.xp = n; addXP(n, t.areaId, { t: t.title, k: 'task', ref: t.id, g: t.goalId || undefined });

}
function reopenTask(t) {

}
function toggleTask(t) {

}
function toggleSub(t, s) {

    if (t.done) reopenTask(t);

    s.done = true; s.xp = SXP[s.priority] || 10; addXP(s.xp, t.areaId, { t: s.title + ' (' + t.title + ')', k: 'sub', ref: t.id + '|' + s.id }); msg = `✓ +${s.xp} XP`;

}
function toggleRoutine(r, d, quiet) {

function addXP(n, areaId, meta = {}) {
  if (!n) return;
  const X = S.xp, before = levelOf(X.total).l;
  const ar = areaId ? S.areas.find(a => a.id === areaId) : null, rBefore = ar ? roleLevelOf(X.byArea[areaId] || 0).l : 0;
  X.total = Math.max(0, X.total + n);
  if (areaId) X.byArea[areaId] = Math.max(0, (X.byArea[areaId] || 0) + n);
  const d = today(); X.days[d] = Math.max(0, (X.days[d] || 0) + (n > 0 ? 1 : -1)); if (!X.days[d]) delete X.days[d];
  if (n > 0) S.xpLog.push({ d, a: areaId || null, x: n, t: String(meta.t || '').slice(0, 140), k: meta.k || 'task', ref: meta.ref || null, g: meta.g || undefined });
  else if (meta.ref) { for (let i = S.xpLog.length - 1; i >= 0; i--) if (S.xpLog[i].ref === meta.ref) { S.xpLog.splice(i, 1); break; } }
  const after = levelOf(X.total).l, rAfter = ar ? roleLevelOf(X.byArea[areaId]).l : 0;
  if (n > 0 && (after > before || rAfter > rBefore)) setTimeout(() => {
    if (rAfter > rBefore) {
      const newRank = Math.floor(rAfter / 5) > Math.floor(rBefore / 5);
      notify(`${ar.name} · Level ${rAfter}${newRank ? ' · ' + rankOf(rAfter).name + ' badge!' : ''}`, `New title: ${roleTitle(ar, rAfter)}`);
    }
    if (after > before) notify(`Overall level ${after}! 🌳`, `You're now a ${overallTitle(after)}.`);
    if (navigator.vibrate) navigator.vibrate([100, 60, 100, 60, 250]);
  }, 400);
}

let hDay = today(), tlScrolled = false, tlPrev = 0;
function dayItems(date) {

    items.push({ kind: 'task', id: t.id, title: t.title, areaId: t.areaId, start: toMin(t.schedTime), dur: t.est || 30, done: t.done }));
  routinesOn(date).filter(r => r.time).forEach(r =>

function layout(items) {
  const clusters = []; let cur = [], end = -1;

  if (cur.length) clusters.push(cur);

  const L = dayLists(date), cands = [...L.overdue, ...L.dueToday, ...L.todo].filter(t => !t.schedTime);

    if (s + d <= dayEnd * 60) { t.schedDate = date; t.schedTime = fromMin(s); t.reminded = null; busy.push([s, s + d]); placed++; }

/* ---------- reminders & notifications ---------- */
function askNotify() { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); }
async function notify(title, body) {

  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      const reg = await navigator.serviceWorker.ready;
      reg.showNotification(title, { body, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', vibrate: [200, 100, 200], tag: title + body });
    } else new Notification(title, { body });
  } catch (e) { }
}
function checkReminders() {
  const d = today(), m = nowMin(), lead = S.settings.lead;
  let changed = false;
  const fire = (obj, time, dur) => {
    const key = d + ' ' + time, st = toMin(time);
    if (m >= st - lead && m < st + dur && obj.reminded !== key) {
      obj.reminded = key; changed = true;
      const mins = st - m;
      notify(obj.title, `${area(obj.areaId).name} · ${mins > 0 ? 'starts in ' + mins + ' min' : 'now'}`);
    }
  };
  S.tasks.forEach(t => { if (t.remind && !t.done && t.schedDate === d && t.schedTime) fire(t, t.schedTime, t.est || 30); });
  routinesOn(d).forEach(r => { if (r.remind && r.time && !S.routineDone[r.id + '|' + d]) fire(r, r.time, r.est || 30); });
  const N = S.settings.nudged || (S.settings.nudged = {});
  for (const k in N) if (k < addDays(d, -3)) delete N[k];
  const L = dayLists(d), left = L.overdue.length + L.dueToday.length + L.todo.length;
  if (S.settings.morning && m >= toMin(S.settings.morning) && m < toMin(S.settings.morning) + 120 && !N[d + 'm']) {
    N[d + 'm'] = 1; changed = true;
    notify('☀️ Good morning', left ? `${left} thing${left > 1 ? 's' : ''} on your list today${L.dueToday.length ? ` · ${L.dueToday.length} due today` : ''}` : 'Your list is clear. Add what matters today.');
  }
  if (S.settings.evening && m >= toMin(S.settings.evening) && m < toMin(S.settings.evening) + 120 && !N[d + 'e']) {
    N[d + 'e'] = 1; changed = true;
    const st = streak(), doneToday = S.xp.days[d] > 0;
    notify('🌙 Evening check-in', doneToday ? `Nice work today 🔥 ${st}-day streak. ${left ? left + ' left — check off what you finished.' : 'All clear!'}` : `Finish one thing to ${st ? 'keep your 🔥 ' + st + '-day streak' : 'start a streak'} 🌱`);
  }
  if (changed) save();
}

/* ---------- calendar export (.ics) ---------- */
const icsEsc = s => String(s || '').replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
const icsDT = (d, m) => d.replace(/-/g, '') + 'T' + fromMin(Math.min(m, 1439)).replace(':', '') + '00';
const stamp = () => new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
const wrapIcs = evs => ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Juggle//EN', 'CALSCALE:GREGORIAN', ...evs, 'END:VCALENDAR'].join('\r\n');
function icsTask(t) {
  const d0 = t.schedDate || t.start || t.due; if (!d0) return null;
  const L = ['BEGIN:VEVENT', 'UID:' + t.id + '@juggle', 'DTSTAMP:' + stamp(), 'SUMMARY:' + icsEsc(t.title), 'DESCRIPTION:' + icsEsc(area(t.areaId).name + (t.notes ? '\n' + t.notes : ''))];
  if (t.schedDate && t.schedTime) { const s = toMin(t.schedTime); L.push('DTSTART:' + icsDT(t.schedDate, s), 'DTEND:' + icsDT(t.schedDate, s + (t.est || 30))); }
  else { const d = t.due || d0; L.push('DTSTART;VALUE=DATE:' + d.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + addDays(d, 1).replace(/-/g, '')); }
  L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(t.title), 'TRIGGER:' + (t.schedTime && t.schedDate ? '-PT' + S.settings.lead + 'M' : 'PT9H'), 'END:VALARM', 'END:VEVENT');
  return L.join('\r\n');
}
function icsRoutine(r) {
  const BY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'], p = r.rep;
  let rule;
  if (p.type === 'weekly') rule = `FREQ=WEEKLY;INTERVAL=${p.every || 1};BYDAY=${p.days.map(x => BY[x]).join(',')}`;
  else if (p.type === 'monthDate') rule = `FREQ=MONTHLY;BYMONTHDAY=${p.mdays.join(',')}`;
  else if (p.type === 'monthWeekday') rule = `FREQ=MONTHLY;BYDAY=${p.nth}${BY[p.wd]}`;
  else return null;
  let d = r.start && r.start > today() ? r.start : today(), i = 0;
  while (!occurs(r, d) && i++ < 400) d = addDays(d, 1);
  const L = ['BEGIN:VEVENT', 'UID:' + r.id + '@juggle', 'DTSTAMP:' + stamp(), 'SUMMARY:' + icsEsc(r.title), 'DESCRIPTION:' + icsEsc(area(r.areaId).name), 'RRULE:' + rule];
  if (r.time) { const s = toMin(r.time); L.push('DTSTART:' + icsDT(d, s), 'DTEND:' + icsDT(d, s + (r.est || 30))); if (r.remind) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(r.title), 'TRIGGER:-PT' + S.settings.lead + 'M', 'END:VALARM'); }
  else L.push('DTSTART;VALUE=DATE:' + d.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + addDays(d, 1).replace(/-/g, ''));
  L.push('END:VEVENT'); return L.join('\r\n');
}

    gid = G.id;
    (Array.isArray(g.milestones) ? g.milestones : []).forEach(m => {
      const mid = uid(); G.milestones.push({ id: mid, title: String(m.title || 'Step').trim().slice(0, 120) });
      (Array.isArray(m.tasks) ? m.tasks : []).forEach(x => { if (x && String(x.title || '').trim()) { S.tasks.push(mkTask(Object.assign({ area: g.area }, x), { goalId: gid, msId: mid, areaId: x.area ? findArea(x.area) : areaId })); added++; } });
    });
  }
  (Array.isArray(data.routines) ? data.routines : []).forEach(r => {
    if (!r || !String(r.title || '').trim()) return;
    const kind = String(r.repeat || 'weekly').toLowerCase(), rep = {};
    if (kind.startsWith('monthlydate')) { rep.type = 'monthDate'; rep.mdays = (r.monthDays || [1]).map(Number).filter(n => n >= 1 && n <= 31); if (!rep.mdays.length) rep.mdays = [1]; }
    else if (kind.startsWith('monthlyweekday')) { rep.type = 'monthWeekday'; rep.nth = [1, 2, 3, 4, -1].includes(+r.nth) ? +r.nth : 1; rep.wd = dayNum(r.weekday) ?? 1; }
    else if (kind.startsWith('times')) {
      rep.type = 'count'; rep.times = Math.max(1, Math.min(31, +r.times || 3)); rep.per = r.per === 'month' ? 'month' : 'week';
      if (rep.per === 'week') rep.days = [...new Set((r.days || []).map(dayNum).filter(d => d !== undefined))];
      else if (+r.fromDay >= 1) { rep.from = Math.min(31, +r.fromDay); rep.to = Math.max(rep.from, Math.min(31, +r.toDay || 31)); }
    }
    else { rep.type = 'weekly'; rep.days = [...new Set((r.days || []).map(dayNum).filter(d => d !== undefined))]; rep.every = Math.max(1, Math.min(4, +r.every || 1)); if (!rep.days.length) rep.days = [1, 2, 3, 4, 5]; }
    S.routines.push({ id: uid(), subs: (Array.isArray(r.subtasks) ? r.subtasks : []).filter(s => s && String(s.title || '').trim()).map(s => ({ id: uid(), title: String(s.title).trim().slice(0, 160), priority: pr(s.priority) })), title: String(r.title).trim().slice(0, 120), areaId: findArea(r.area || (data.goal && data.goal.area)), rep, days: rep.days || [], time: nt(r.time), est: Math.min(480, Math.max(5, +r.minutes || 30)), remind: !!nt(r.time), start: today(), active: true, goalId: gid, createdAt: Date.now() });
    rAdded++;
  });
  if (!moved && !added && !rAdded && !gid) { claudeUndo = null; return toast('Nothing to import in that reply'); }
  claudeNote = ''; const wasAdjust = claudeAdjust; claudeAdjust = null; save();
  if (gid) { curGoal = gid; view = 'goal'; }
  render();
  const parts = [goalName && `🎯 ${wasAdjust ? 'Updated' : 'New goal'}: ${esc(goalName)}`, added && `${added} step${added > 1 ? 's' : ''}`, moved && `${moved} placed on days`, rAdded && `${rAdded} routine${rAdded > 1 ? 's' : ''}`].filter(Boolean);
  openSheet(`<h2>Added ✓</h2><p>${parts.join(' · ')}</p>
  <div class="btns"><button class="pri" type="button" data-act="cclose">Looks good</button><button type="button" class="danger" data-act="cundo">Undo</button></div>`);
}

/* ---------- Organize my skill tree with Claude ---------- */
function organizePrompt() {
  const fr = S.settings.lang === 'fr';
  const lines = [fr ? 'Réponds-moi en français.' : 'Reply in the language of my latest message (English or French).', '',
    'Please ORGANIZE MY SKILL TREE in my app Juggle. Below is my history per role (what I completed, how often, when).', '',
    'For EACH role:', '1) Group my history into 3–8 named SKILLS (short, fun, specific names, like game perks: "Payroll Pro", "MATLAB Labs", "Exam Prep"). For each skill give 3–8 lowercase keywords (EN and FR) that appear in my task titles, so the app can match future tasks.',
    '2) Write my NEXT CHAPTER of titles: 6–8 new titles for levels ABOVE my current level (spaced about every 5 levels), funny but motivating, matching what I actually do in that role now. Keep growing them forever, never an ending.', '',
    'You can ask me a couple of questions first if useful. When I say "final plan", reply with ONE json code block exactly like this:',
    '```json\n{"skills":[{"area":"<role name exactly>","name":"","keywords":["",""]}],\n "titles":[{"area":"<role name exactly>","level":25,"title":""}]}\n```',
    'Keep "area" exactly as my role names below. Never translate keys.', '', 'MY ROLES & HISTORY:'];
  S.areas.forEach(a => {
    const R = roleLevelOf(S.xp.byArea[a.id] || 0), es = S.xpLog.filter(e => e.a === a.id && e.k !== 'past');
    const cnt = {}; es.forEach(e => { const k = String(e.t || '').replace(/\s*\(.*\)$/, '').trim(); if (k) { cnt[k] = cnt[k] || { n: 0, last: e.d }; cnt[k].n++; cnt[k].last = e.d; } });
    const top = Object.entries(cnt).sort((x, y) => y[1].n - x[1].n).slice(0, 60);
    lines.push('', `## ${a.name}${a.closed ? ' (CHAPTER CLOSED ' + a.closed + ' — no new titles needed, but name its skills)' : ''} — Level ${R.l}, title "${roleTitle(a, R.l)}"`,
      `Current title ladder: ${ladderOf(a).map(x => x.level + ': ' + x.title).join(' · ')}`,
      top.length ? top.map(([t, v]) => `- ${t} ×${v.n} (last ${v.last})`).join('\n') : '- (no history yet)');
  });
  return lines.join('\n');
}
function organizeSheet() {
  openSheet(`<h2>✨ Organize with Claude</h2>
  <p class="muted">Claude groups your history into named skills for each role (shown on your tree) and writes your next chapter of titles.</p>
  <div class="erow"><span>Language</span><button type="button" class="chip ${S.settings.lang !== 'fr' ? 'on' : ''}" data-act="olang" data-id="en">English</button><button type="button" class="chip ${S.settings.lang === 'fr' ? 'on' : ''}" data-act="olang" data-id="fr">Français</button></div>
  <div class="btns"><button class="pri" type="button" data-act="ocopy">1 · Copy my history for Claude</button></div>
  <p class="muted">2 · Paste it in your Juggle Planner project, chat if you want, then ask for the final plan.</p>
  <textarea id="cout" readonly hidden style="min-height:120px;font-size:13px"></textarea>
  <label style="margin-top:12px">3 · Paste Claude's reply<textarea id="oin" placeholder="Juggle finds the json part automatically" style="min-height:90px"></textarea></label>
  <div class="btns"><button class="pri" type="button" data-act="oimport">Update my tree</button></div>`);
}
function organizeImport() {
  const raw = $('#oin').value, blocks = [...raw.matchAll(/```(?:json)?\s*([\s\S]*?)```/g)].map(x => x[1]);
  let data = null;
  for (const b of [...blocks.reverse(), (raw.match(/(\{[\s\S]*\})/) || [])[1]]) { try { if (b) { data = JSON.parse(b); break; } } catch (e) { } }
  if (!data) return toast("Couldn't find the json in that reply");
  const before = JSON.stringify(S); let ns = 0, nt = 0;
  const bySkill = {};
  (Array.isArray(data.skills) ? data.skills : []).forEach(x => {
    if (!x || !String(x.name || '').trim()) return;
    const id = findArea(x.area); (bySkill[id] = bySkill[id] || []).push({ name: String(x.name).trim().slice(0, 40), keywords: (Array.isArray(x.keywords) ? x.keywords : []).map(k => String(k).toLowerCase().trim()).filter(Boolean).slice(0, 12) }); ns++;
  });
  for (const id in bySkill) { const a = S.areas.find(x => x.id === id); if (a) a.skills = bySkill[id]; }
  (Array.isArray(data.titles) ? data.titles : []).forEach(x => {
    if (!x || !String(x.title || '').trim() || !(+x.level >= 2)) return;
    const a = S.areas.find(y => y.id === findArea(x.area)); if (!a) return;
    a.titles = (a.titles || []).filter(t => t.level !== +x.level); a.titles.push({ level: Math.round(+x.level), title: String(x.title).trim().slice(0, 50) }); nt++;
  });
  if (!ns && !nt) return toast('Nothing to import in that reply');
  claudeUndo = before; save(); growTab = 'tree'; view = 'grow'; render();
  openSheet(`<h2>Tree updated ✓</h2><p>${ns} skills named · ${nt} new titles unlocked ahead</p>
  <div class="btns"><button class="pri" type="button" data-act="cclose">Show my tree</button><button type="button" class="danger" data-act="cundo">Undo</button></div>`);
}

/* ---------- actions ---------- */
const go = v => () => { closeSheet(); view = v; window.scrollTo(0, 0); render(); };
const actions = {
  add: () => openEditor(),
  edit: editTask, redit: editRoutine,
  tog: id => { const t = S.tasks.find(x => x.id === id); if (!t) return; closeSheet(); toggleTask(t); },
  stog: v => { const [tid, sid] = v.split('|'), t = S.tasks.find(x => x.id === tid), s = t && t.subs.find(x => x.id === sid); if (s) toggleSub(t, s); },
  sx: id => { openSubs.has(id) ? openSubs.delete(id) : openSubs.add(id); render(); },
  rtog: id => { const r = S.routines.find(x => x.id === id); if (!r) return; closeSheet(); toggleRoutine(r, view === 'today' ? day : today()); },
  del: async id => { if (!await ask('Delete this task?')) return; S.tasks = S.tasks.filter(t => t.id !== id); save(); closeSheet(); render(); },
  rdel: async id => { if (!await ask('Delete this routine?')) return; S.routines = S.routines.filter(r => r.id !== id); save(); closeSheet(); render(); },
  eset: v => { const i = v.indexOf('|'); edSet(v.slice(0, i), v.slice(i + 1)); edRerender(); },
  ecday: v => { const d = +v, ds = E.rep.cdays || []; E.rep.cdays = ds.includes(d) ? ds.filter(x => x !== d) : [...ds, d]; edRerender(); },
  rstog: v => { const [rid, sid] = v.split('|'), r = S.routines.find(x => x.id === rid), s = r && (r.subs || []).find(x => x.id === sid); if (s) toggleRoutineSub(r, s, view === 'today' ? day : today()); },
  eday: v => { const d = +v, ds = E.rep.days; E.rep.days = ds.includes(d) ? ds.filter(x => x !== d) : [...ds, d]; edRerender(); },
  esubadd: () => { E.subs.push({ title: '', priority: 2 }); edRerender(); const ins = document.querySelectorAll('.sedit input'); ins[ins.length - 1]?.focus(); },
  esubdel: i => { E.subs.splice(+i, 1); edRerender(); },
  dprev: () => { day = addDays(day, -1); render(); }, dnext: () => { day = addDays(day, 1); render(); }, dtoday: () => { day = today(); render(); },
  hprev: () => { hDay = addDays(hDay, -1); tlScrolled = false; render(); }, hnext: () => { hDay = addDays(hDay, 1); tlScrolled = false; render(); }, htoday: () => { hDay = today(); tlScrolled = false; render(); },
  plan: () => autoPlan(hDay),
  filter: id => { filterArea = id; render(); },
  fstart: fStart, fpause: fPause, freset: fReset, fskip: switchMode,
  focustask: id => { const t = T(); t.taskId = id; if (!t.running) { t.mode = 'work'; t.remaining = fullLen(); } save(); closeSheet(); view = 'focus'; render(); },
  gofocus: go('focus'), gogrow: go('grow'), gomore: go('more'), gogoals: go('goals'), gohours: () => { tlScrolled = false; go('hours')(); },
  goal: id => { curGoal = id; go('goal')(); },
  gtab: k => { growTab = k; treeSel = null; render(); },
  tnode: v => { const [a, l] = v.split('|'); treeSel = treeSel && treeSel.a === a && treeSel.l === +l ? null : { a, l: +l }; const w = $('#treewrap'), sl = w ? w.scrollLeft : 0, st = w ? w.scrollTop : 0; render(); const w2 = $('#treewrap'); if (w2) { w2.scrollLeft = sl; w2.scrollTop = st; } },
  treerole: id => { const a = S.areas.find(x => x.id === id); growTab = 'tree'; treeSel = { a: id, l: roleLevelOf(S.xp.byArea[id] || 0).l }; render(); const w = $('#treewrap'); if (w) { const i = S.areas.indexOf(a); w.scrollLeft = Math.max(0, i * 104 - 120); } },
  organize: organizeSheet, ocopy: () => copyText(organizePrompt(), 'Copied ✓ Paste it into your Juggle Planner chat'), oimport: organizeImport,
  olang: k => { S.settings.lang = k; save(); organizeSheet(); },
  aclose: async id => {
    applySettings();
    const a = area(id), L = roleLevelOf(S.xp.byArea[id] || 0).l, open = S.tasks.filter(t => t.areaId === id && !t.done).length;
    if (activeAreas().length < 2) return toast('Keep at least one active role');
    if (!await ask(`Close the "${a.name}" chapter? It turns gold in your Hall of Fame at Lv ${L} · ${roleTitle(a, L)}, leaves the radar, and its routines stop.${open ? ` Its ${open} open task(s) will be archived.` : ''} You can reopen it anytime.`, '🎓 Close chapter')) return;
    a.closed = today();
    S.routines.forEach(r => { if (r.areaId === id && r.active !== false) { r.active = false; r.closedBy = id; } });
    S.tasks.forEach(t => { if (t.areaId === id && !t.done) t.archived = id; });
    if (filterArea === id) filterArea = 'all';
    save(); settingsForm(); toast(`🎓 ${a.name} chapter closed. Congrats!`);
  },
  areopen: id => {
    applySettings(); const a = area(id); a.closed = null;
    S.routines.forEach(r => { if (r.closedBy === id) { r.active = true; delete r.closedBy; } });
    S.tasks.forEach(t => { if (t.archived === id) delete t.archived; });
    save(); settingsForm(); toast(`${a.name} is back in play`);
  },
  mstog: id => { openMs.has(id) ? openMs.delete(id) : openMs.add(id); render(); },
  claudenew: () => { claudeAdjust = null; claudeSheet(); },
  claudeadjust: id => { claudeAdjust = id; claudeNote = ''; claudeSheet(); },
  cmode: k => { claudeNote = $('#cnote').value; claudeMode = k; claudeSheet(); },
  clang: k => { claudeNote = $('#cnote').value; S.settings.lang = k; save(); claudeSheet(); },
  ccopy: () => copyText(claudePrompt($('#cnote').value), 'Copied ✓ Paste it into your Juggle Planner chat'),
  cfinish: () => copyText(S.settings.lang === 'fr' ? "C'est bon pour moi. Donne-moi le plan final maintenant, en UN seul bloc json au format décrit." : 'Looks good. Please give me the final plan now as ONE json code block in the format I described.', 'Copied ✓ Paste it into Claude'),
  cimport: claudeImport, cclose: closeSheet,
  cundo: () => { if (claudeUndo) { S = JSON.parse(claudeUndo); claudeUndo = null; save(); if (view !== 'grow') view = 'goals'; render(); toast('Import undone'); } closeSheet(); },
  gdel: async id => {
    if (!await ask('Delete this goal and its unfinished steps? Finished steps stay in your history.')) return;
    S.tasks = S.tasks.filter(t => !(t.goalId === id && !t.done)); S.tasks.forEach(t => { if (t.goalId === id) { t.goalId = null; t.msId = null; } });
    S.routines = S.routines.filter(r => r.goalId !== id); S.goals = S.goals.filter(g => g.id !== id);
    save(); view = 'goals'; render();
  },
  settings: settingsForm,
  aadd: () => { applySettings(); const cs = ['#e85d75', '#14b8a6', '#eab308', '#64748b', '#8b5cf6']; S.areas.push({ id: uid(), name: 'New role', color: cs[S.areas.length % cs.length] }); save(); settingsForm(); },
  adel: async id => {
    if (S.areas.length < 2) return toast('Keep at least one role');
    applySettings();
    const a = area(id), rest = S.areas.filter(x => x.id !== id);
    const n = S.tasks.filter(t => t.areaId === id).length + S.routines.filter(r => r.areaId === id).length;
    if (!await ask(`Delete "${a.name}"?${n ? ` Its ${n} item(s) move to "${rest[0].name}".` : ''}`)) return;
    S.areas = rest;
    S.tasks.forEach(t => { if (t.areaId === id) t.areaId = rest[0].id; });
    S.routines.forEach(r => { if (r.areaId === id) r.areaId = rest[0].id; });
    S.goals.forEach(g => { if (g.areaId === id) g.areaId = rest[0].id; });
    if (filterArea === id) filterArea = 'all';
    save(); settingsForm();
  },
  perm: () => Notification.requestPermission().then(() => settingsForm()),
  ics: id => { const e = icsTask(S.tasks.find(t => t.id === id)); if (!e) return toast('Give it a date first'); download('juggle-task.ics', wrapIcs([e]), 'text/calendar'); },
  ricsone: id => { const e = icsRoutine(S.routines.find(r => r.id === id)); if (!e) return toast("This repeat type can't go in a calendar"); download('juggle-routine.ics', wrapIcs([e]), 'text/calendar'); },
  icsall: () => {
    const t0 = today();
    const evs = S.tasks.filter(t => !t.done && ((t.schedDate && t.schedDate >= t0) || (t.due && t.due >= t0))).map(icsTask).concat(S.routines.filter(r => r.active !== false).map(icsRoutine)).filter(Boolean);
    if (!evs.length) return toast('Nothing upcoming to export');
    download('juggle-upcoming.ics', wrapIcs(evs), 'text/calendar'); toast(`Exported ${evs.length} item(s)`);
  },
  icsnudge: () => {
    applySettings(); save();
    const s = S.settings, evs = [];
    const ev = (id, t, title, body) => { const st = toMin(t); return ['BEGIN:VEVENT', `UID:${id}@juggle`, 'DTSTAMP:' + stamp(), 'SUMMARY:' + icsEsc(title), 'DESCRIPTION:' + icsEsc(body), 'RRULE:FREQ=DAILY', 'DTSTART:' + icsDT(today(), st), 'DTEND:' + icsDT(today(), st + 5), 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(title), 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT'].join('\r\n'); };
    if (s.morning) evs.push(ev('nudge-morning', s.morning, '☀️ Plan your day in Juggle', "Open Juggle and look at today's list."));
    if (s.evening) evs.push(ev('nudge-evening', s.evening, '🌙 Check off today in Juggle', 'Mark what you finished — grow your tree and keep your streak.'));
    if (!evs.length) return toast('Set a morning or evening time first');
    download('juggle-daily-nudges.ics', wrapIcs(evs), 'text/calendar'); toast('Open the file to add the nudges to your calendar');
  },
  backup: () => download(`juggle-backup-${today()}.json`, JSON.stringify(S, null, 1), 'application/json'),
  restore: () => $('#imp').click(),
  install: () => { installEvt.prompt(); installEvt = null; closeSheet(); }
};

document.addEventListener('click', e => {
  const tab = e.target.closest('nav button');
  if (tab) { view = tab.dataset.tab; if (view === 'today') day = today(); window.scrollTo(0, 0); render(); return; }
  if (e.target.id === 'sheet') return closeSheet();
  const el = e.target.closest('[data-act]');
  if (el && actions[el.dataset.act]) { e.preventDefault(); actions[el.dataset.act](el.dataset.id); }
});
document.addEventListener('change', e => { if (e.target.id === 'fsel') { T().taskId = e.target.value || null; save(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#dlg').classList.contains('open')) closeSheet();
  if (e.key === 'Enter' && e.target.matches && e.target.matches('.sedit input')) { e.preventDefault(); actions.esubadd(); }
});
$('#imp').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data.areas || !data.tasks) throw 0;
    if (!await ask('Replace all current data with this backup?', 'Replace')) { e.target.value = ''; return; }
    localStorage.setItem(KEY, JSON.stringify(data)); S = load(); save(); closeSheet(); render(); toast('Backup restored');
  } catch (err) { toast("That file isn't a Juggle backup"); }
  e.target.value = '';
});
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (S.timer && S.timer.running && Date.now() >= S.timer.end) fComplete();
  checkReminders();
  if (!$('#sheet').classList.contains('open')) render();
});

/* ---------- tick & boot ---------- */
let lastMin = nowMin(), lastDay = today();
setInterval(() => {
  const t = S.timer;
  if (t && t.running && Date.now() >= t.end) fComplete();
  if (view === 'focus') updateFocus();
  renderPill();
  const m = nowMin();
  if (m !== lastMin) {
    lastMin = m; checkReminders();
    if (today() !== lastDay) { if (day === lastDay) day = today(); lastDay = today(); if (!$('#sheet').classList.contains('open')) render(); }
  }
}, 1000);
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => { });
try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => { }); } catch (e) { }
initHistory();
render();
checkReminders();
</script>
